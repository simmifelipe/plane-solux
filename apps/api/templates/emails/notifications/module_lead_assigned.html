<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Você é o responsável pela demanda {{module_name}}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f9f9f9;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#474747;">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:8px;">
      <tr>
        <td style="padding:28px 32px;">
          <h2 style="margin:0 0 12px 0;font-size:18px;color:#171717;">Você é o responsável por uma demanda</h2>
          <p style="margin:0;line-height:1.5;">Olá, {{lead_name}}. {% if actor_name %}{{actor_name}} atribuiu a você{% else %}Foi atribuída a você{% endif %} a demanda <strong>{{module_name}}</strong>.</p>
          <p style="margin:24px 0 0 0;">
            <a href="{{module_url}}" style="display:inline-block;background:#3f76ff;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;">Abrir demanda</a>
          </p>
          <p style="margin:24px 0 0 0;font-size:12px;color:#8a8a8a;">{{workspace_name}} · {{project_name}}</p>
        </td>
      </tr>
    </table>
  </body>
</html>
