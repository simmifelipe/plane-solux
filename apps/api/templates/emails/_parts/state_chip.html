{% comment %}Chip for a state name. Expects `value`.{% endcomment %}<span style="display:inline-block;padding:3px 10px 3px 8px;border-radius:999px;background-color:#F3F4F6;border:1px solid #E5E7EB;font-size:12px;line-height:18px;font-weight:600;color:#374151;white-space:nowrap;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background-color:{% if value == 'Done' or value == 'Concluído' %}#12B76A{% elif value == 'In Progress' %}#F79009{% elif value == 'Cancelled' %}#F04438{% elif value == 'Todo' %}#3F76FF{% else %}#98A2B3{% endif %};"></span>{{ value }}</span>
